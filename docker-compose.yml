# ---------------------------------------------------------------------------
# Ambiente local do DB Layer.
#
#   docker compose up
#
# Sobe origem (MySQL), destino (Oracle Database Free) e o proprio servico.
# O primeiro boot do Oracle demora alguns minutos: ele precisa criar o banco.
# Os boots seguintes reaproveitam o volume e sao rapidos.
# ---------------------------------------------------------------------------
services:

  mysql:
    image: mysql:8.0
    container_name: dbl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vendas
    ports:
      - "3307:3306"          # 3307 no host para nao conflitar com MySQL local
    volumes:
      - mysql-data:/var/lib/mysql
      - ./seeds/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  oracle-free:
    # Imagem da comunidade, bem menor que a oficial e o padrao de fato para
    # desenvolvimento. ATENCAO: Oracle Database nao roda nativamente em Mac
    # Apple Silicon (ver README).
    image: gvenzl/oracle-free:23-slim
    container_name: dbl-oracle
    environment:
      ORACLE_PASSWORD: oracle          # senha de SYS/SYSTEM
      APP_USER: vendas                 # usuario da aplicacao
      APP_USER_PASSWORD: vendas
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./seeds/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  db-layer:
    build: .
    container_name: dbl-api
    # Tudo explicito aqui: o compose sobe sem precisar de .env.
    # (Credenciais de desenvolvimento, as mesmas dos seeds.)
    environment:
      PORT: 3002
      SRC_HOST: mysql
      SRC_PORT: 3306
      SRC_USER: readonly
      SRC_PASSWORD: readonly
      SRC_DATABASE: vendas
      TGT_HOST: oracle-free
      TGT_PORT: 1521
      TGT_SERVICE: FREEPDB1
      TGT_USER: vendas
      TGT_PASSWORD: vendas
      SBX_USER: sandbox
      SBX_PASSWORD: sandbox
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
      oracle-free:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  oracle-data:
